[project]
name = "carnet-entretien"
version = "0.1.0"
description = "Carnet d'entretien pour les véhicules des particuliers"
readme = "README.md"
authors = [
    { name = "antoine", email = "antoine-78280@hotmail.fr" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.5",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
